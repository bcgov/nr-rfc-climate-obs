name: Download and process hourly weather obs from datamart

on:
  # push:
  #   branches:
  #     - "main"
  schedule:
  # job should run at 9.01 pst which translates to 5pm UTC
    - cron: '10 * * * *'
  workflow_dispatch:

jobs:
  download_datamart_climateobs:
    defaults:
      run:
        shell: bash
    name: 'Download and process hourly datamart weather observations'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false  # Allows subsequent attempts to run even if an earlier one fails
      max-parallel: 1
      matrix:
        # Spawns up to 3 distinct runner instances sequentially
        attempt: [1, 2, 3]
    environment: PROD
    env:
      OBJ_STORE_BUCKET: ${{ secrets.OBJ_STORE_BUCKET }}
      OBJ_STORE_SECRET: ${{ secrets.OBJ_STORE_SECRET }}
      OBJ_STORE_USER: ${{ secrets.OBJ_STORE_USER }}
      OBJ_STORE_HOST: ${{ vars.OBJ_STORE_HOST }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
    - uses: actions/checkout@v6
      id: checkout
      with:
       fetch-depth: 0

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Check if Previous Attempt Succeeded
      id: status_check
      env:
          GH_TOKEN: ${{ github.token }}
      run: |
        # Use GitHub CLI to check if this specific workflow run has already succeeded in an earlier matrix leg
        COMPLETED_SUCCESSFUL_JOBS=$(gh run view ${{ github.run_id }} --json jobs --jq '.jobs[] | select(.status == "completed" and .conclusion != "failure" and .conclusion != "cancelled") | .name' | grep -c "download" || true)

        if [ "$COMPLETED_SUCCESSFUL_JOBS" -gt 0 ]; then
          echo "An earlier runner completed the task successfully. Skipping."
          echo "skip=true" >> $GITHUB_OUTPUT
        else
          echo "No successful runs completed yet. Proceeding."
          echo "skip=false" >> $GITHUB_OUTPUT
        fi


    - name: Fast Fail Connection Check
      if: steps.status_check.outputs.skip != 'true'
      run: |
        echo "Testing connection to object storage endpoint from runner IP..."
        # Replace with your actual object storage endpoint (e.g., S3, Azure Blob, etc.)
        # If connection times out in 5 seconds, it kills this runner immediately.
        curl --connect-timeout 5 -I https://nrs.objectstore.gov.bc.ca/rfcdata

    - id: install_dependencies
      name: install python dependencies
      shell: bash
      run: |
        pip install --upgrade pip
        pip install -r scripts/python/requirements-datamartdl.txt

    - id: debug
      name: debug and list files
      shell: bash
      run: |
        ls -la

    - name: download from DataMart
      id: download_DataMart
      if: steps.status_check.outputs.skip != 'true'
      run: |
        python scripts/python/DataMart_hourly_download.py

    # - id: download_DataMart
    #   name: download datamart climateobs data and upload to s3
    #   shell: bash
    #   run: |
    #     python scripts/python/DataMart_hourly_download.py
